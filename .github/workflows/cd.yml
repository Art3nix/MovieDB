name: Deploy MovieDB

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          script: |
            set -e
            cd /home/ubuntu/MovieDB
            git fetch origin
            git reset --hard origin/production
            # This rebuilds the image (picking up new pip packages if requirements.txt changed) 
            # and restarts only the containers that need updating
            docker compose up -d --build
